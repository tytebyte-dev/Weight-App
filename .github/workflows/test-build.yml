name: Test build

# Test build (signed with signing/testkey.x509.pem) of NewTube. Uploads five separate artifacts:
# arm64-v8a, armeabi-v7a, x86, x86_64 and one universal APK.
# -PemulatorAbi adds the x86_64 split (see splits{} in smarttubetv/build.gradle).

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NDK_VERSION: 21.0.6113669   # smarttubetv/build.gradle ndkVersion
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      # MediaServiceCore is someone else's repository (a submodule), so the changes the app needs
      # live in patches/ and are applied on top of the pinned commit. Safe to re-run.
      - name: Apply MediaServiceCore patches
        run: |
          set -euo pipefail
          shopt -s nullglob
          for patch in "$GITHUB_WORKSPACE"/patches/*.patch; do
            if git -C MediaServiceCore apply --check -R "$patch" 2>/dev/null; then
              echo "Already applied: $(basename "$patch")"
            else
              git -C MediaServiceCore apply --whitespace=nowarn "$patch"
              echo "Applied: $(basename "$patch")"
            fi
          done

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install the NDK
        run: |
          set -euo pipefail
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" > /dev/null

      - name: Build bypass cores (Xray via gomobile, hev-socks5-tunnel)
        run: |
          set -euo pipefail
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" > /dev/null
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          chmod +x native/build-cores.sh
          native/build-cores.sh

      - name: Prepare the signing key
        env:
          PK8_B64: ${{ secrets.TESTKEY_PK8_B64 }}
        run: .github/scripts/setup-signing.sh testkey

      - name: Build debug APKs
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :smarttubetv:assembleStmobileDebug -PemulatorAbi
          mkdir dist
          cp smarttubetv/build/outputs/renamed_apks/stmobileDebug/NewTube_*.apk dist/
          ls -l dist

      - name: Check that all five APKs exist
        run: |
          set -euo pipefail
          for abi in arm64-v8a armeabi-v7a x86 x86_64 universal; do
            f="$(ls dist/NewTube_*_${abi}.apk 2>/dev/null | head -n 1 || true)"
            if [ -z "$f" ]; then
              echo "::error::No ${abi} APK in dist/"
              exit 1
            fi
          done
          test "$(ls dist/*.apk | wc -l)" -eq 5

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: NewTube_arm64-v8a
          path: dist/*_arm64-v8a.apk
          if-no-files-found: error

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: NewTube_armeabi-v7a
          path: dist/*_armeabi-v7a.apk
          if-no-files-found: error

      - name: Upload x86 APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: NewTube_x86
          path: dist/*_x86.apk
          if-no-files-found: error

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: NewTube_x86_64
          path: dist/*_x86_64.apk
          if-no-files-found: error

      - name: Upload universal APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: NewTube_universal
          path: dist/*_universal.apk
          if-no-files-found: error
