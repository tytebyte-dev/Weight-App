name: Release

# Release build: signed with signing/testkey.x509.pem, published as a GitHub Release with an
# automatic tag (v<versionName>, or v<versionName>.<run number> when that tag is taken) and
# automatic notes: the changes since the previous release plus a link to the full comparison.
# Run it by hand from the Actions tab.

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: Mark the release as a pre-release
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NDK_VERSION: 21.0.6113669   # smarttubetv/build.gradle ndkVersion
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          fetch-depth: 0
          persist-credentials: false

      - name: Apply MediaServiceCore patches
        run: |
          set -euo pipefail
          shopt -s nullglob
          for patch in "$GITHUB_WORKSPACE"/patches/*.patch; do
            if git -C MediaServiceCore apply --check -R "$patch" 2>/dev/null; then
              echo "Already applied: $(basename "$patch")"
            else
              git -C MediaServiceCore apply --whitespace=nowarn "$patch"
              echo "Applied: $(basename "$patch")"
            fi
          done

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install the NDK
        run: |
          set -euo pipefail
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" > /dev/null

      - name: Build bypass cores (Xray via gomobile)
        run: |
          set -euo pipefail
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" > /dev/null
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          chmod +x native/build-cores.sh
          native/build-cores.sh

      - name: Prepare the signing key
        env:
          TESTKEY_PK8_B64: ${{ secrets.TESTKEY_PK8_B64 }}
        run: .github/scripts/setup-signing.sh

      - name: Work out the version and the tag
        id: ver
        run: |
          set -euo pipefail
          version="$(grep -E '^\s*versionName "' smarttubetv/build.gradle | tail -n 1 | sed -E 's/.*"([^"]+)".*/\1/')"
          tag="v${version}"
          git fetch --tags --quiet origin 2>/dev/null || true
          if gh release view "$tag" >/dev/null 2>&1 || git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            tag="v${version}.${GITHUB_RUN_NUMBER}"
          fi
          prev="$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prev=$prev" >> "$GITHUB_OUTPUT"
          echo "Release $tag (previous: ${prev:-none})"

      - name: Build release APKs
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :smarttubetv:assembleStmobileRelease
          mkdir dist
          cp smarttubetv/build/outputs/renamed_apks/stmobileRelease/NewTube_*.apk dist/
          ls -l dist
          test "$(ls dist/*.apk | wc -l)" -ge 1

      - name: Check the signature
        run: |
          set -euo pipefail
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)"
          want="$(openssl x509 -in signing/testkey.x509.pem -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':' | tr 'A-F' 'a-f')"
          for apk in dist/*.apk; do
            got="$("$apksigner" verify --print-certs "$apk" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1)"
            if [ "$got" != "$want" ]; then
              echo "::error::$apk is not signed with signing/testkey.x509.pem ($got)"
              exit 1
            fi
          done
          echo "All APKs carry the expected signature."

      - name: Publish the release
        env:
          TAG: ${{ steps.ver.outputs.tag }}
          VERSION: ${{ steps.ver.outputs.version }}
          PREV: ${{ steps.ver.outputs.prev }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          {
            echo "Weight App ${VERSION}"
            echo
            echo "Commit: [\`${GITHUB_SHA::7}\`](https://github.com/${repo}/commit/${GITHUB_SHA})"
            if [ -n "$PREV" ]; then
              echo
              echo "**Full changelog:** https://github.com/${repo}/compare/${PREV}...${TAG}"
            fi
            echo
            echo "APKs are signed with the \`signing/testkey.x509.pem\` certificate. Pick the file for your device's ABI (arm64-v8a is right for most phones); \`universal\` runs everywhere."
          } > notes-head.md
          args=(--target "$GITHUB_SHA" --title "Weight App ${VERSION}" --notes-file notes-head.md --generate-notes)
          if [ -n "$PREV" ]; then args+=(--notes-start-tag "$PREV"); fi
          if [ "$PRERELEASE" = "true" ]; then args+=(--prerelease); fi
          gh release create "$TAG" "${args[@]}" dist/*.apk
